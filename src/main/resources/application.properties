spring.application.name=gaea-api

spring.datasource.url=jdbc:mysql://localhost:3306/gaea
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=true

spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

jwt.secret=${JWT_SECRET}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
app.convite-aluno.expiracao-horas=${CONVITE_ALUNO_EXPIRACAO_HORAS:48}
app.verificacao-email.expiracao-horas=${VERIFICACAO_EMAIL_EXPIRACAO_HORAS:24}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5174}
app.email.enabled=${EMAIL_ENABLED:false}
app.email.remetente=${SMTP_FROM:}
app.viacep.base-url=${VIACEP_BASE_URL:https://viacep.com.br}
app.viacep.connect-timeout=${VIACEP_CONNECT_TIMEOUT:3s}
app.viacep.read-timeout=${VIACEP_READ_TIMEOUT:5s}
app.documentos.storage.tipo=${DOCUMENTOS_STORAGE_TIPO:local}
app.documentos.storage.diretorio=${DOCUMENTOS_STORAGE_DIRETORIO:${user.home}/.gaea/documentos}
app.documentos.tamanho-maximo-bytes=${DOCUMENTOS_TAMANHO_MAXIMO_BYTES:10485760}

spring.servlet.multipart.max-file-size=${DOCUMENTOS_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${DOCUMENTOS_MULTIPART_MAX_REQUEST_SIZE:11MB}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor=INFO

spring.jackson.deserialization.fail-on-unknown-properties=true
