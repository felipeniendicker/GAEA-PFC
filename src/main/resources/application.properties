spring.application.name=gaea-api
server.port=${PORT:8080}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gaea}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.clean-disabled=${FLYWAY_CLEAN_DISABLED:true}
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:true}

jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:gaea-api}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
app.convite-aluno.expiracao-horas=${CONVITE_ALUNO_EXPIRACAO_HORAS:48}
app.verificacao-email.expiracao-horas=${VERIFICACAO_EMAIL_EXPIRACAO_HORAS:24}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5174}
app.email.enabled=${EMAIL_ENABLED:false}
app.email.remetente=${SMTP_FROM:}
app.password-reset.hash-secret=${PASSWORD_RESET_HASH_SECRET:${jwt.secret}}
app.password-reset.expiracao-minutos=${PASSWORD_RESET_EXPIRATION_MINUTES:15}
app.password-reset.intervalo-minimo-segundos=${PASSWORD_RESET_MIN_INTERVAL_SECONDS:60}
app.password-reset.limite-identificador=${PASSWORD_RESET_EMAIL_LIMIT:3}
app.password-reset.janela-identificador-minutos=${PASSWORD_RESET_EMAIL_WINDOW_MINUTES:60}
app.password-reset.limite-origem=${PASSWORD_RESET_ORIGIN_LIMIT:10}
app.password-reset.janela-origem-minutos=${PASSWORD_RESET_ORIGIN_WINDOW_MINUTES:15}
app.login.limite-identificador=${LOGIN_EMAIL_LIMIT:5}
app.login.limite-origem=${LOGIN_ORIGIN_LIMIT:20}
app.login.janela-minutos=${LOGIN_WINDOW_MINUTES:15}
app.login.maximo-chaves=${LOGIN_MAX_KEYS:10000}
app.solicitacao-instituicao.expiracao-horas=${INSTITUTION_REQUEST_TOKEN_EXPIRATION_HOURS:24}
app.solicitacao-instituicao.limite-origem-hora=${INSTITUTION_REQUEST_ORIGIN_LIMIT:5}
app.admin-bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin-bootstrap.nome=${ADMIN_BOOTSTRAP_NAME:}
app.admin-bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin-bootstrap.senha=${ADMIN_BOOTSTRAP_PASSWORD:}
app.admin-bootstrap.confirmacao=${ADMIN_BOOTSTRAP_CONFIRMATION:}
app.viacep.base-url=${VIACEP_BASE_URL:https://viacep.com.br}
app.viacep.connect-timeout=${VIACEP_CONNECT_TIMEOUT:3s}
app.viacep.read-timeout=${VIACEP_READ_TIMEOUT:5s}
app.documentos.storage.tipo=${DOCUMENTOS_STORAGE_TIPO:local}
app.documentos.storage.diretorio=${DOCUMENTOS_STORAGE_DIRETORIO:${user.home}/.gaea/documentos}
app.documentos.tamanho-maximo-bytes=${DOCUMENTOS_TAMANHO_MAXIMO_BYTES:10485760}

# A carga profissional permanece desativada por padrão e exige confirmações adicionais.
app.professional-demo-seed.enabled=${PROFESSIONAL_DEMO_SEED_ENABLED:false}
app.professional-demo-seed.expected-database=${PROFESSIONAL_DEMO_EXPECTED_DATABASE:}
app.professional-demo-seed.expected-environment=${PROFESSIONAL_DEMO_EXPECTED_ENVIRONMENT:}
app.professional-demo-seed.confirmation=${PROFESSIONAL_DEMO_CONFIRMATION:}
app.professional-demo-seed.reference-date=${PROFESSIONAL_DEMO_REFERENCE_DATE:2026-11-21}
app.professional-demo-seed.password.felipe=${PROFESSIONAL_DEMO_PASSWORD_FELIPE:}
app.professional-demo-seed.password.aluno=${PROFESSIONAL_DEMO_PASSWORD_ALUNO:}
app.professional-demo-seed.password.instituicao=${PROFESSIONAL_DEMO_PASSWORD_INSTITUICAO:}
app.professional-demo-seed.password.supervisor=${PROFESSIONAL_DEMO_PASSWORD_SUPERVISOR:}

spring.servlet.multipart.max-file-size=${DOCUMENTOS_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${DOCUMENTOS_MULTIPART_MAX_REQUEST_SIZE:11MB}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor=INFO

spring.jackson.deserialization.fail-on-unknown-properties=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.mail.enabled=false
